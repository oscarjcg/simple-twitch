name: Build

on:
  push:
  pull_request:

jobs:
  build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build in Docker
        run: docker compose --profile prod run --rm st-angular-build

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/simple-twitch/
