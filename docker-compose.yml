services:
  st-angular:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4201:4201"
    container_name: st-angular
    volumes:
       - .:/usr/src/simple-twitch
       - node_modules:/usr/src/simple-twitch/node_modules
    command: sh -c "npm install && npm start"

volumes:
  node_modules:
