services:
  st-angular:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "4201:4201"
    container_name: st-angular
    volumes:
       - .:/usr/src/simple-twitch
       - node_modules:/usr/src/simple-twitch/node_modules
    command: sh -c "npm install && npm start"

  st-angular-build:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["prod"]
    volumes:
       - .:/usr/src/simple-twitch
       - node_modules:/usr/src/simple-twitch/node_modules
    command: sh -c "npm install && npm run build:prod"

  st-angular-test:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["test"]
    environment:
      - CI=true
      - NG_CLI_ANALYTICS=false
    volumes:
       - .:/usr/src/simple-twitch
       - node_modules:/usr/src/simple-twitch/node_modules
    command: sh -c "npm install && npm run test:ci"

  st-angular-e2e:
    image: mcr.microsoft.com/playwright:v1.64.1-noble
    profiles: ["test"]
    working_dir: /usr/src/simple-twitch
    ipc: host
    environment:
      - CI=true
      - NG_CLI_ANALYTICS=false
    volumes:
       - .:/usr/src/simple-twitch
       - node_modules:/usr/src/simple-twitch/node_modules
    command: sh -c "npm install && npm run e2e"

volumes:
  node_modules:
